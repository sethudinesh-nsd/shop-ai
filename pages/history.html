<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop AI — History</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="../css/variable.css" />
  <link rel="stylesheet" href="../css/style.css?v=9" />
  <link rel="stylesheet" href="../css/responsive.css?v=9" />
  <link rel="stylesheet" href="../css/manageaccount/index.css?v=2" />
  <link rel="stylesheet" href="../css/history.css?v=1" />
</head>
<body>
  <script>document.documentElement.style.visibility = 'hidden';</script>

  <div class="app">
    <aside class="sidebar">
      <div class="sidebar__brand">
        <span class="brand-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2 L14 9 L21 11 L14 13 L12 20 L10 13 L3 11 L10 9 Z"/>
          </svg>
        </span>
        <span class="brand-name">Shop AI</span>
      </div>

      <nav class="sidebar__nav">
        <a href="index.html" class="nav-item" data-nav="home">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 10.5 12 3l9 7.5"/>
              <path d="M5 9.5V21h14V9.5"/>
              <path d="M9 21v-6h6v6"/>
            </svg>
          </span>
          <span class="nav-label">Home</span>
        </a>
        <a href="wardrobe.html" class="nav-item" data-nav="wardrobe">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19.5 21H4.5a1 1 0 0 1-1-1V8.6a1 1 0 0 1 .4-.8l3.1-2.3"/>
              <path d="M15 5.5 18.1 7.8a1 1 0 0 1 .4.8V20"/>
              <path d="M9 4h6l-1 3H10Z"/>
              <path d="M4 12h3M17 12h3"/>
            </svg>
          </span>
          <span class="nav-label">Wardrobe</span>
        </a>
        <a href="history.html" class="nav-item nav-item--active" data-nav="history">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 3-6.7"/>
              <path d="M3 4v5h5"/>
              <path d="M12 8v4l3 2"/>
            </svg>
          </span>
          <span class="nav-label">History</span>
        </a>
      </nav>

      <div class="sidebar__user">
        <div class="user-avatar">
          <img alt="" onerror="this.style.display='none'; this.parentElement.classList.add('user-avatar--fallback')" />
        </div>
        <div class="user-meta">
          <span class="user-name">Account</span>
        </div>
        <span class="user-chevron">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>
        </span>
      </div>

      <div class="profile-menu" id="profileMenu" aria-hidden="true">
        <div class="profile-menu__identity">
          <div class="profile-menu__avatar user-avatar user-avatar--small">
            <img alt="" onerror="this.style.display='none'; this.parentElement.classList.add('user-avatar--fallback')" />
          </div>
          <div class="profile-menu__identity-text">
            <span class="profile-menu__name">Account</span>
            <span class="profile-menu__email"></span>
          </div>
        </div>
        <div class="profile-menu__divider"></div>
        <div class="profile-menu__actions">
          <a href="#" class="profile-menu__item" data-profile-action="manage-account">
            Manage account
          </a>
          <button type="button" class="profile-menu__item profile-menu__item--danger" data-profile-action="logout">
            Log out
          </button>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar"></header>

      <section class="history-page">
        <header class="history-header">
          <h1 class="history-title">History</h1>
          <p class="history-subtitle">Your previous conversations with Shop AI.</p>
        </header>
        
        <div class="history-loading" id="historySkeleton">
          <span class="history-loading__spinner"></span>
        </div>

        
           
        <div class="history-empty" id="historyEmpty" hidden>
          <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5 8 8 0 0 1-3.2-.67L5 20l1.67-4.3A7.5 7.5 0 1 1 20 11.5Z"/>
          </svg>
          <p class="history-empty__title">No conversations yet</p>
          <p class="history-empty__subtitle">Chat with your stylist on the Home page and it'll show up here.</p>
        </div>

        <section class="history-list" id="historyList" aria-label="Conversation history"></section>
      </section>
    </main>
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/profile.js"></script>
  <script src="../js/supabaseClient.js"></script>
  <script src="../js/app.js" defer></script>
  <script src="../js/manageaccount/index.js?v=2" defer></script>
  <script src="../js/manageaccount/profile-insights.js?v=2" defer></script>
  <script src="../js/manageaccount/settings-nav.js?v=2" defer></script>
  <script src="../js/history.js"></script>
</body>
</html>
