
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History — Shop AI</title>

  <link rel="stylesheet" href="../css/variable.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">

  <style>
    .history-page {
      min-height: 100vh;
      padding: 34px 42px 48px;
      overflow-y: auto;
    }

    .history-header {
      max-width: 900px;
      margin: 0 auto 28px;
    }

    .history-title {
      margin: 0;
      font-size: clamp(28px, 3vw, 38px);
      line-height: 1.15;
      letter-spacing: -0.03em;
    }

    .history-subtitle {
      margin: 9px 0 0;
      color: rgba(30, 30, 30, 0.58);
      font-size: 14px;
    }

    .history-list {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      gap: 12px;
    }

    .history-group-title {
      margin: 18px 4px 6px;
      color: rgba(30, 30, 30, 0.48);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      min-height: 76px;
      padding: 15px 18px;
      border: 1px solid rgba(30, 30, 30, 0.08);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.62);
      box-shadow: 0 8px 24px rgba(30, 30, 30, 0.045);
      text-align: left;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .history-item:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.84);
      box-shadow: 0 12px 30px rgba(30, 30, 30, 0.07);
    }

    .history-icon {
      flex: 0 0 40px;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: rgba(124, 58, 237, 0.08);
      color: #7c3aed;
    }

    .history-copy {
      min-width: 0;
      flex: 1;
    }

    .history-item-title {
      display: block;
      overflow: hidden;
      color: #1f1f1f;
      font-size: 14px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-item-preview {
      display: block;
      margin-top: 5px;
      overflow: hidden;
      color: rgba(30, 30, 30, 0.52);
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-time {
      flex: 0 0 auto;
      color: rgba(30, 30, 30, 0.4);
      font-size: 12px;
    }

    @media (max-width: 1024px) {
      .history-page {
        padding: 28px 24px 40px;
      }
    }

    @media (max-width: 640px) {
      .history-page {
        padding: 22px 14px 32px;
      }

      .history-item {
        min-height: 70px;
        padding: 13px 14px;
        border-radius: 15px;
      }

      .history-time {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="sidebarMount"></div>

  <main class="history-page">
    <header class="history-header">
      <h1 class="history-title">History</h1>
      <p class="history-subtitle">Your previous conversations with Shop AI.</p>
    </header>

    <section class="history-list" aria-label="Conversation history">
      <div class="history-group-title">Today</div>

      <button type="button" class="history-item">
        <span class="history-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5 8 8 0 0 1-3.2-.67L5 20l1.67-4.3A7.5 7.5 0 1 1 20 11.5Z"/>
          </svg>
        </span>
        <span class="history-copy">
          <span class="history-item-title">What should I wear for a wedding?</span>
          <span class="history-item-preview">Help me choose a refined outfit for an evening wedding.</span>
        </span>
        <span class="history-time">Today</span>
      </button>

      <button type="button" class="history-item">
        <span class="history-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7.5 12 4l8 3.5v9L12 20l-8-3.5v-9Z"/>
            <path d="M4 7.5 12 11l8-3.5M12 11v9"/>
          </svg>
        </span>
        <span class="history-copy">
          <span class="history-item-title">Build outfits from my wardrobe</span>
          <span class="history-item-preview">Create three casual looks using pieces I already own.</span>
        </span>
        <span class="history-time">Today</span>
      </button>

      <div class="history-group-title">Yesterday</div>

      <button type="button" class="history-item">
        <span class="history-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 5h14v14H5z"/>
            <path d="M8 9h8M8 13h5"/>
          </svg>
        </span>
        <span class="history-copy">
          <span class="history-item-title">College outfit ideas</span>
          <span class="history-item-preview">Give me simple everyday outfits that look polished.</span>
        </span>
        <span class="history-time">Yesterday</span>
      </button>

      <div class="history-group-title">Earlier</div>

      <button type="button" class="history-item">
        <span class="history-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v18M3 12h18"/>
          </svg>
        </span>
        <span class="history-copy">
          <span class="history-item-title">Wardrobe analysis</span>
          <span class="history-item-preview">Which pieces should I add to make my wardrobe more versatile?</span>
        </span>
        <span class="history-time">Earlier</span>
      </button>
    </section>
  </main>

  <script src="../js/app.js" defer></script>
</body>
</html>
