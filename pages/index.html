<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop AI — Home</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <div class="app">
    <!-- ============================== -->
    <!-- SIDEBAR                        -->
    <!-- ============================== -->
    <aside class="sidebar">
      <div class="sidebar__brand">
        <span class="brand-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
            <path d="M12 2 L14 9 L21 11 L14 13 L12 20 L10 13 L3 11 L10 9 Z" fill="url(#sparkleGrad)"/>
            <defs>
              <linearGradient id="sparkleGrad" x1="3" y1="2" x2="21" y2="20" gradientUnits="userSpaceOnUse">
                <stop stop-color="#a855f7"/>
                <stop offset="1" stop-color="#7c3aed"/>
              </linearGradient>
            </defs>
          </svg>
        </span>
        <span class="brand-name">Shop AI</span>
      </div>

      <nav class="sidebar__nav">
        <a href="#" class="nav-item nav-item--active" data-nav="home">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 10.5 12 3l9 7.5"/>
              <path d="M5 9.5V21h14V9.5"/>
              <path d="M9 21v-6h6v6"/>
            </svg>
          </span>
          <span class="nav-label">Home</span>
        </a>

        <a href="#" class="nav-item" data-nav="chat">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
            </svg>
          </span>
          <span class="nav-label">AI Chat</span>
        </a>

        <a href="#" class="nav-item" data-nav="wardrobe">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19.5 21H4.5a1 1 0 0 1-1-1V8.6a1 1 0 0 1 .4-.8l3.1-2.3"/>
              <path d="M15 5.5 18.1 7.8a1 1 0 0 1 .4.8V20"/>
              <path d="M9 4h6l-1 3H10Z"/>
              <path d="M4 12h3M17 12h3"/>
            </svg>
          </span>
          <span class="nav-label">Wardrobe</span>
        </a>

        <a href="#" class="nav-item" data-nav="planner">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19.5 21H4.5a1 1 0 0 1-1-1V8.6a1 1 0 0 1 .4-.8l3.1-2.3"/>
              <path d="M15 5.5 18.1 7.8a1 1 0 0 1 .4.8V20"/>
              <path d="M9 4h6l-1 3H10Z"/>
              <path d="M9 15h6M9 12h2"/>
            </svg>
          </span>
          <span class="nav-label">Outfit Planner</span>
        </a>

        <a href="#" class="nav-item" data-nav="saved">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.8 8.6c0 4.7-8.8 10-8.8 10s-8.8-5.3-8.8-10a4.6 4.6 0 0 1 8.8-2 4.6 4.6 0 0 1 8.8 2Z"/>
            </svg>
          </span>
          <span class="nav-label">Saved Looks</span>
        </a>

        <a href="#" class="nav-item" data-nav="history">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 3-6.7"/>
              <path d="M3 4v5h5"/>
              <path d="M12 8v4l3 2"/>
            </svg>
          </span>
          <span class="nav-label">History</span>
        </a>
      </nav>

      <div class="sidebar__user">
        <div class="user-avatar">
          <img src="assets/images/avatar.jpg" alt="Dinesh" onerror="this.style.display='none'; this.parentElement.classList.add('user-avatar--fallback')" />
        </div>
        <div class="user-meta">
          <span class="user-name">Dinesh</span>
          <span class="user-plan">Premium Plan</span>
        </div>
        <span class="user-chevron">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>
        </span>
      </div>
    </aside>

    <!-- ============================== -->
    <!-- MAIN CONTENT                   -->
    <!-- ============================== -->
    <main class="main">
      <header class="topbar">
        <div class="theme-toggle" id="themeToggle">
          <button class="theme-toggle__btn theme-toggle__btn--active" data-theme="light" aria-label="Light mode">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
            </svg>
          </button>
          <button class="theme-toggle__btn" data-theme="dark" aria-label="Dark mode">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
            </svg>
          </button>
        </div>
      </header>

      <section class="hero" id="hero">
        <!-- Greeting + title: fades out on first message -->
        <div class="hero__intro" id="heroIntro">
          <p class="hero__greeting">Good afternoon, <span class="hero__name">Dinesh</span> <span class="hero__wave">👋</span></p>
          <h1 class="hero__title">What are you looking to wear today?</h1>

          <div class="hero__suggestions" id="heroSuggestions">
            <button class="suggestion-chip" data-prompt="Suggest a college outfit under ₹3000">
              <span class="suggestion-chip__icon">👔</span> College Outfit
            </button>
            <button class="suggestion-chip" data-prompt="Analyze my outfit photo">
              <span class="suggestion-chip__icon">🖼️</span> Analyze Photo
            </button>
            <button class="suggestion-chip" data-prompt="Suggest a wedding function look">
              <span class="suggestion-chip__icon">🤵</span> Wedding Look
            </button>
            <button class="suggestion-chip" data-prompt="What's trending this week?">
              <span class="suggestion-chip__icon">📈</span> Trending Styles
            </button>
          </div>
        </div>

        <!-- Chat thread: hidden until the first message is sent -->
        <div class="hero__chat" id="chatMessages" aria-live="polite"></div>

        <!-- Search bar: identical markup/design, wrapper only controls position -->
        <div class="searchbar-wrapper" id="searchbarWrapper">
          <div class="searchbar">
            <button class="searchbar__icon-btn" aria-label="Add" id="uploadBtn">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 5v14M5 12h14"/>
              </svg>
            </button>
            <input type="file" id="fileInput" hidden />
            <input
              type="text"
              class="searchbar__input"
              placeholder="Describe your look, occasion or paste a link..."
              id="searchInput"
            />
            <button class="searchbar__icon-btn" aria-label="Voice input">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/>
                <path d="M19 11a7 7 0 0 1-14 0"/>
                <path d="M12 18v3"/>
              </svg>
            </button>
            <button class="searchbar__submit" aria-label="Submit" id="submitBtn">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 19V5M5 12l7-7 7 7"/>
              </svg>
            </button>
          </div>
        </div>
      </section>

      <section class="features" id="features">
        <div class="feature">
          <span class="feature__icon feature__icon--purple">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
              <path d="M12 3 L13.6 9.4 L20 11 L13.6 12.6 L12 19 L10.4 12.6 L4 11 L10.4 9.4 Z" fill="currentColor"/>
            </svg>
          </span>
          <span class="feature__text">
            <span class="feature__title">AI Powered</span>
            <span class="feature__subtitle">Smart recommendations</span>
          </span>
        </div>

        <div class="feature">
          <span class="feature__icon feature__icon--slate">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </span>
          <span class="feature__text">
            <span class="feature__title">Personalized</span>
            <span class="feature__subtitle">Just for your style</span>
          </span>
        </div>

        <div class="feature">
          <span class="feature__icon feature__icon--slate">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
              <path d="M3 6h18"/>
              <path d="M16 10a4 4 0 0 1-8 0"/>
            </svg>
          </span>
          <span class="feature__text">
            <span class="feature__title">Trusted Stores</span>
            <span class="feature__subtitle">Top brands. Best prices.</span>
          </span>
        </div>

        <div class="feature">
          <span class="feature__icon feature__icon--slate">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/>
              <path d="m9 12 2 2 4-4"/>
            </svg>
          </span>
          <span class="feature__text">
            <span class="feature__title">Secure Checkout</span>
            <span class="feature__subtitle">Safe &amp; hassle-free</span>
          </span>
        </div>
      </section>
    </main>
  </div>

  <!-- Message bubble template (cloned by script.js, never shown directly) -->
  <template id="messageTemplate">
    <div class="msg">
      <div class="msg__avatar"></div>
      <div class="msg__col">
        <div class="msg__bubble"></div>
        <div class="msg__meta">
          <span class="msg__time"></span>
          <button class="msg__copy" type="button" title="Copy" data-action="copy">Copy</button>
        </div>
      </div>
    </div>
  </template>

  <script src="../js/script.js"></script>
</body>
</html>
