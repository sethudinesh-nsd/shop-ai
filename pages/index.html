<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop AI — Home</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,400;1,400;1,500&display=swap"
    rel="stylesheet"
  />

  <!-- Syntax highlighting theme (token colors only — background/spacing are overridden by style.css) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css" />

  <link rel="stylesheet" href="../css/style.css?v=9" />
  <link rel="stylesheet" href="../css/responsive.css?v=9" />
  <link rel="stylesheet" href="../css/manageaccount/index.css?v=1" />

  <!-- Markdown parsing (marked), HTML sanitization (DOMPurify), syntax highlighting (highlight.js).
       Served from jsDelivr (mirrors npm directly) rather than cdnjs, which only
       mirrors a curated subset of versions and can 404 on an exact pin. -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
</head>
<body>
  <!-- Hidden until app.js confirms a Clerk session exists, so a signed-out
       visitor never sees a flash of Home before being redirected. -->
  <script>document.documentElement.style.visibility = 'hidden';</script>

  <div class="app">
    <!-- ============================== -->
    <!-- SIDEBAR                        -->
    <!-- ============================== -->
    <aside class="sidebar">
      <div class="sidebar__brand">
        <span class="brand-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
            <path d="M12 2 L14 9 L21 11 L14 13 L12 20 L10 13 L3 11 L10 9 Z" fill="url(#sparkleGrad)"/>
            <defs>
              <linearGradient id="sparkleGrad" x1="3" y1="2" x2="21" y2="20" gradientUnits="userSpaceOnUse">
                <stop stop-color="#a855f7"/>
                <stop offset="1" stop-color="#7c3aed"/>
              </linearGradient>
            </defs>
          </svg>
        </span>
        <span class="brand-name">Shop AI</span>
      </div>

      <nav class="sidebar__nav">
        <a href="#" class="nav-item nav-item--active" data-nav="home">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 10.5 12 3l9 7.5"/>
              <path d="M5 9.5V21h14V9.5"/>
              <path d="M9 21v-6h6v6"/>
            </svg>
          </span>
          <span class="nav-label">Home</span>
        </a>
<a href="wardrobe.html" class="nav-item" data-nav="wardrobe">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19.5 21H4.5a1 1 0 0 1-1-1V8.6a1 1 0 0 1 .4-.8l3.1-2.3"/>
              <path d="M15 5.5 18.1 7.8a1 1 0 0 1 .4.8V20"/>
              <path d="M9 4h6l-1 3H10Z"/>
              <path d="M4 12h3M17 12h3"/>
            </svg>
          </span>
          <span class="nav-label">Wardrobe</span>
        </a>
<a href="#" class="nav-item" data-nav="history">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 3-6.7"/>
              <path d="M3 4v5h5"/>
              <path d="M12 8v4l3 2"/>
            </svg>
          </span>
          <span class="nav-label">History</span>
        </a>
      </nav>

      <div class="sidebar__user">
        <div class="user-avatar">
          <img src="../assets/images/avatar.jpg" alt="" onerror="this.style.display='none'; this.parentElement.classList.add('user-avatar--fallback')" />
        </div>
        <div class="user-meta">
          <span class="user-name">Account</span>
        </div>
        <span class="user-chevron">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>
        </span>
      </div>

      <div class="profile-menu" id="profileMenu" aria-hidden="true">
        <div class="profile-menu__identity">
          <div class="profile-menu__avatar user-avatar user-avatar--small">
            <img src="../assets/images/avatar.jpg" alt="" onerror="this.style.display='none'; this.parentElement.classList.add('user-avatar--fallback')" />
          </div>
          <div class="profile-menu__identity-text">
            <span class="profile-menu__name">Account</span>
            <span class="profile-menu__email"></span>
          </div>
        </div>
        <div class="profile-menu__divider"></div>
        <div class="profile-menu__actions">
  <a href="#" class="profile-menu__item" data-profile-action="manage-account">
    Manage account
  </a>
  <button type="button" class="profile-menu__item profile-menu__item--danger" data-profile-action="logout">
    Log out
  </button>
</div>
      </div>
    </aside>

    <!-- ============================== -->
    <!-- MAIN CONTENT                   -->
    <!-- ============================== -->
    <main class="main">
      <header class="topbar">
      </header>

      <section class="hero" id="hero">
        <!-- Greeting + title: fades out on first message -->
        <div class="hero__intro" id="heroIntro">
          <p class="hero__greeting">Good afternoon, <span class="hero__name">there</span> <span class="hero__wave">👋</span></p>
          <p class="hero__voice">Let's find something that feels like you.</p>
          <h1 class="hero__title">What are you looking to wear today?</h1>

          <div class="hero__suggestions" id="heroSuggestions">
            <button class="suggestion-chip" data-prompt="Suggest a college outfit under ₹3000">
              <span class="suggestion-chip__icon">👔</span> College Outfit
            </button>
            <button class="suggestion-chip" data-prompt="Analyze my outfit photo">
              <span class="suggestion-chip__icon">🖼️</span> Analyze Photo
            </button>
            <button class="suggestion-chip" data-prompt="Suggest a wedding function look">
              <span class="suggestion-chip__icon">🤵</span> Wedding Look
            </button>
            <button class="suggestion-chip" data-prompt="What's trending this week?">
              <span class="suggestion-chip__icon">📈</span> Trending Styles
            </button>
          </div>
        </div>

        <!-- Chat thread: hidden until the first message is sent -->
        <div class="hero__chat-scroll" id="chatScroll">
          <div class="hero__chat" id="chatMessages" aria-live="polite"></div>
        </div>

        <!-- Search bar: identical markup/design, wrapper only controls position -->
        <div class="searchbar-wrapper" id="searchbarWrapper">
          <!-- Attachment previews for images picked but not yet sent. Hidden
               (and empty) whenever pendingImages is empty — see script.js. -->
          <div class="attachments-row" id="attachmentsRow" hidden></div>
          <div class="searchbar">
            <button class="searchbar__icon-btn" aria-label="Add photo" id="uploadBtn" title="Add photo">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 5v14M5 12h14"/>
              </svg>
            </button>
            <input type="file" id="fileInput" accept="image/*" multiple hidden />
            <textarea
              class="searchbar__input"
              placeholder="Describe your look, occasion or paste a link..."
              id="searchInput"
              rows="1"
            ></textarea>
            <button class="searchbar__icon-btn" aria-label="Voice input" title="Voice input">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/>
                <path d="M19 11a7 7 0 0 1-14 0"/>
                <path d="M12 18v3"/>
              </svg>
            </button>
            <button class="searchbar__submit" aria-label="Submit" id="submitBtn" title="Send">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 19V5M5 12l7-7 7 7"/>
              </svg>
            </button>
          </div>
        </div>
      </section>
</main>
  </div>

  <!-- Modern ChatGPT-style message template (cloned by script.js, never shown directly) -->
  <template id="messageTemplate">
    <div class="message">
      <div class="message__label">
        <span class="message__label-avatar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
            <path d="M12 2 L14 9 L21 11 L14 13 L12 20 L10 13 L3 11 L10 9 Z" fill="url(#msgSparkleGrad)"/>
            <defs>
              <linearGradient id="msgSparkleGrad" x1="3" y1="2" x2="21" y2="20" gradientUnits="userSpaceOnUse">
                <stop stop-color="#a855f7"/>
                <stop offset="1" stop-color="#7c3aed"/>
              </linearGradient>
            </defs>
          </svg>
        </span>
        <span class="message__label-text"></span>
      </div>
      <div class="message__content"></div>
      <div class="message__actions" data-role-actions>
        <button class="message__action" data-action="copy" data-for="all" title="Copy" aria-label="Copy">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="12" height="12" rx="2.5"/>
            <path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>
          </svg>
        </button>
        <button class="message__action" data-action="regenerate" data-for="assistant" title="Regenerate" aria-label="Regenerate">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 15.3-6.4L21 8"/>
            <path d="M21 3v5h-5"/>
            <path d="M21 12a9 9 0 0 1-15.3 6.4L3 16"/>
            <path d="M3 21v-5h5"/>
          </svg>
        </button>
        <button class="message__action" data-action="like" data-for="assistant" title="Good response" aria-label="Good response">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 22V11M2 13v7a2 2 0 0 0 2 2h12.5a2 2 0 0 0 2-1.6l1.3-6.5A2 2 0 0 0 17.8 12H14V6.5a2.5 2.5 0 0 0-5 0L7 11"/>
          </svg>
        </button>
        <button class="message__action" data-action="dislike" data-for="assistant" title="Bad response" aria-label="Bad response">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 2v11M22 11V4a2 2 0 0 0-2-2H7.5a2 2 0 0 0-2 1.6L4.2 10.1A2 2 0 0 0 6.2 12.5H10V18a2.5 2.5 0 0 0 5 0l2-6.5"/>
          </svg>
        </button>
      </div>
    </div>
  </template>


  <script src="../js/auth.js"></script>
  <script src="../js/app.js" defer></script>
  <script src="../js/manageaccount/index.js" defer></script>
  <script src="../js/script.js"></script>
</body>
</html>
